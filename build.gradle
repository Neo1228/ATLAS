plugins {
    id 'base'
}

group = 'com.atlas'
version = '0.1.0-SNAPSHOT'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    checkstyle {
        toolVersion = '14.4.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    }

    dependencies {
        add('implementation', platform('org.springframework.boot:spring-boot-dependencies:4.1.2'))
        add('testImplementation', platform('org.springframework.boot:spring-boot-dependencies:4.1.2'))
        add('testImplementation', 'org.springframework.boot:spring-boot-starter-test')
        add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('check') }
}
