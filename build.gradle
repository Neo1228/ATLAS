plugins {
    id 'base'
}

group = 'com.atlas'
version = '0.1.0-SNAPSHOT'
ext.lombokVersion = '1.18.48'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    checkstyle {
        toolVersion = '14.4.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    }

    dependencies {
        add('implementation', platform('org.springframework.boot:spring-boot-dependencies:4.1.2'))
        add('testImplementation', platform('org.springframework.boot:spring-boot-dependencies:4.1.2'))
        add('testImplementation', 'org.springframework.boot:spring-boot-starter-test')
        add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Lombok은 Spring/JPA annotation을 처리하지 않으므로 processing 진단만 제외.
        options.compilerArgs.addAll(['-Xlint:all,-processing', '-Werror'])
    }

    tasks.named('test') {
        useJUnitPlatform()
        // 개발자 환경에서는 발열·메모리 부담을 줄이고 CI workflow에서만 2 fork를 명시한다.
        // CI runner 실측은 로컬 A/B와 달라 EXP-030에 별도로 기록한다.
        maxParallelForks = (System.getenv('ATLAS_TEST_FORKS') ?: '1') as int
        forkEvery = 0
        // 두 서비스의 어휘 계약 파일은 테스트가 실행 중에 읽는다. 입력으로 선언하지 않으면 파일만 바뀐 경우
        // Gradle 이 test 를 up-to-date/캐시로 건너뛰어 계약 위반을 놓친다.
        inputs.file(rootProject.file('contracts/inventory-location-vocabulary.json'))
            .withPropertyName('inventoryLocationVocabularyContract')
            .withPathSensitivity(PathSensitivity.NONE)
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('check') }
}
