# 실제 장애 주입 테스트 전용 Compose overlay. 기본/운영 Compose에는 포함하지 않는다.
# 공개 포트는 전부 loopback에만 바인딩하고 PostgreSQL은 Toxiproxy 경유만 노출한다.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_FAULT_DB_PASSWORD:-atlas-real-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${ATLAS_FAULT_MAIL_API_PORT:-19025}:8025"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${ATLAS_FAULT_TOXI_API_PORT:-19475}:8474"
      - "127.0.0.1:${ATLAS_FAULT_PAYPAL_PROXY_PORT:-19443}:18443"
      - "127.0.0.1:${ATLAS_FAULT_CAPTURE_PROXY_PORT:-19444}:18444"
      - "127.0.0.1:${ATLAS_FAULT_PG_PROXY_PORT:-19432}:15432"
      - "127.0.0.1:${ATLAS_FAULT_SMTP_PROXY_PORT:-19026}:11026"
