# Round-robin HTTP balancer for the EXP-035 distributed comparison.
# Deliberately dumb: no caching, no retries, no sticky sessions, so any
# throughput or latency change is attributable to the extra app replicas and not
# to balancer behaviour.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream atlas_application {
        server app-a:8080 max_fails=0;
        server app-b:8080 max_fails=0;
        server app-c:8080 max_fails=0;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_pass http://atlas_application;
        }

        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
