# Round-robin HTTP balancer for the ATLAS distributed measurements (EXP-035/038).
#
# Design intent: no caching and no sticky sessions, so throughput and latency changes
# are attributable to the app replicas rather than to the balancer.
#
# Availability behaviour is deliberately NOT "dumb". An earlier version used
# `max_fails=0`, which tells nginx to never consider a peer unhealthy: with one
# replica stopped, 6 of 20 requests (30%) still failed instead of being routed to a
# healthy peer. Passive health checks plus bounded retries are required for rolling
# restarts and replica loss, and they are measured in EXP-038.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream atlas_application {
        # Passive health checks: after 3 failures within 10s a peer is taken out of
        # rotation for 10s and then probed again. This is what makes a rolling
        # restart or a crashed replica a non-event for shoppers.
        server app-a:8080 max_fails=3 fail_timeout=10s;
        server app-b:8080 max_fails=3 fail_timeout=10s;
        server app-c:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            # Retry the next peer on connection failure or a 502/503/504, which is
            # exactly what a stopped or restarting replica returns.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # 3 tries covers the window before a failed peer is marked down: with one
            # replica dead out of three, a single retry can land on the dead peer again.
            proxy_next_upstream_tries 3;
            # Never retry a non-idempotent request that already reached a peer: a
            # retried POST could double-submit a checkout. Only retry when the
            # request could not be sent (connection-level failure).
            proxy_next_upstream_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_pass http://atlas_application;
        }

        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
