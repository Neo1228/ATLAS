name: 설계/요구사항 제안
description: 미결정 사항 또는 범위 내 개선을 추적합니다.
title: "[제안]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제 또는 미결정 질문
      description: 문제·영향을 요약하고 사실/가정/미정을 구분. 복잡한 변경은 이유와 영향을 Issue 본문에 직접 작성.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안과 대안
      description: 선택 이유와 주요 대안·trade-off. 미승인 정책은 `△ Proposed`.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 성공/검증 기준
      description: 완료 시 관찰 가능한 결과와 실패/경계 조건.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: 영향 범위와 시각화 또는 해당 없음
      description: 영향 상태·규칙·불변조건 요약. 복잡한 흐름은 Mermaid; 기준 문서가 있으면 핵심 설명과 링크 추가. 단순 변경은 N/A 사유.
    validations:
      required: true
  - type: input
    id: trace
    attributes:
      label: 관련 추적 ID
      description: Q/FR/NFR/BR/INV/ADR/EXP/TEST 또는 milestone ID
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 작업 단위 제안
      description: 독립 검토 가능한 범위와 완료 기준. 큰 작업은 관련 sub-issues로 분해.
    validations:
      required: true
