name: Application capacity probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run readiness diagnostics, a 5s email-flow smoke, or the full load matrix
        type: choice
        required: true
        default: readiness
        options:
          - readiness
          - smoke
          - matrix

permissions:
  contents: read

concurrency:
  group: application-capacity-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity:
    name: k6 + PostgreSQL + Prometheus (4-vCPU runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify load-probe script syntax
        shell: bash
        run: bash -n load-tests/run-exp033-capacity-matrix.sh
      - name: Verify runner capacity
        run: docker info
      - name: Create ephemeral load-test credentials
        shell: bash
        run: |
          echo "ATLAS_JWT_SIGNING_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "K6_TEST_ACCOUNT_PASSWORD=LoadTest-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Build application JAR and Compose image
        run: |
          ./gradlew --no-daemon :atlas-application:bootJar
          docker compose --profile observability --profile loadtest build application
      - name: Run remote capacity probe
        env:
          LOAD_PROBE_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p atlas-application/build/k6-results
          # The pinned k6 image runs as a non-root UID; this ephemeral Actions-only bind mount
          # must be writable for its end-of-test JSON summary.
          chmod 0777 atlas-application/build/k6-results
          bash load-tests/run-exp033-capacity-matrix.sh
      - name: Upload k6 summaries and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp033-application-capacity-probe
          path: atlas-application/build/k6-results
          retention-days: 7
          if-no-files-found: warn
      - name: Tear down ephemeral Compose stack and volumes
        if: always()
        run: docker compose --profile observability --profile loadtest down --volumes --remove-orphans
