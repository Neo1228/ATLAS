name: PayPal sandbox contract check

# PayPer Sandbox 계약 검증. 스텁이 아니라 실제 api-m.sandbox.paypal.com을 호출해
# ATLAS가 의존하는 요청/응답 형태가 여전히 유효한지 확인한다.
#
# 왜 필요한가
# ----------
# 단위 테스트와 로드 측정은 로컬 스텁을 쓴다. 스텁은 우리가 기대하는 응답을 우리가
# 작성한 것이므로, PayPal이 필드나 상태 이름을 바꿔도 통과한다. 이 워크플로는 실제
# Sandbox에 최소 요청을 보내 그 가정을 검증한다.
#
# 범위
# ----
# - OAuth client_credentials 토큰 발급
# - 주문 생성(POST /v2/checkout/orders)
# - 주문 조회(GET /v2/checkout/orders/{id})
# 승인·캡처·환불은 구매자 승인 상호작용이 필요하므로 여기서 다루지 않는다.
# 그 경로는 통합 테스트(MockWebServer)와 로컬 실측이 담당한다.
#
# 실행 조건
# --------
# 저장소 secret(PAYPAL_CLIENT_ID/SECRET/BASE_URL)이 있을 때만 돈다.
# 수동 실행만 허용해 실제 Sandbox 호출이 PR마다 발생하지 않게 한다.
on:
  workflow_dispatch:
    inputs:
      amount:
        description: 주문 금액(USD). Sandbox이므로 실제 결제는 발생하지 않는다.
        required: false
        default: "1.00"

permissions:
  contents: read

jobs:
  sandbox-contract:
    name: PayPal sandbox API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 자격 증명 확인
        id: guard
        env:
          CID: ${{ secrets.PAYPAL_CLIENT_ID }}
          CSECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          if [ -z "$CID" ] || [ -z "$CSECRET" ]; then
            echo "::warning::PAYPAL_CLIENT_ID/SECRET secret이 없어 Sandbox 검증을 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sandbox 계약 검증
        if: steps.guard.outputs.ready == 'true'
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_BASE_URL: ${{ secrets.PAYPAL_BASE_URL }}
          AMOUNT: ${{ inputs.amount }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}"
          base="${base%/}"

          echo "1) OAuth 토큰 발급"
          token_json=$(curl -sS --fail-with-body -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" \
            -d grant_type=client_credentials "$base/v1/oauth2/token")
          token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          if [ -z "$token" ]; then
            echo "::error::access_token을 받지 못했습니다."
            exit 1
          fi
          echo "   토큰 발급 성공(길이 ${#token})"

          request_id="atlas-contract-$(date +%s)-$RANDOM"
          echo "2) 주문 생성"
          order_json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -H "PayPal-Request-Id: $request_id" \
            -d "{\"intent\":\"AUTHORIZE\",\"purchase_units\":[{\"reference_id\":\"atlas-contract\",\"amount\":{\"currency_code\":\"USD\",\"value\":\"$AMOUNT\"}}]}" \
            "$base/v2/checkout/orders")
          order_id=$(printf '%s' "$order_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          order_status=$(printf '%s' "$order_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "   order_id=$order_id status=$order_status"

          # ATLAS 클라이언트가 파싱하는 필드가 실제 응답에 있는지 확인한다.
          printf '%s' "$order_json" | python3 - <<'PY'
          import json, sys
          body = json.load(sys.stdin)
          required = ["id", "status", "links"]
          missing = [k for k in required if k not in body]
          if missing:
              raise SystemExit(f"::error::주문 응답에 필수 필드가 없습니다: {missing}")
          rels = {l.get("rel") for l in body.get("links", [])}
          if body["status"] == "CREATED" and "approve" not in rels:
              raise SystemExit("::error::CREATED 주문에 approve 링크가 없습니다.")
          print("   주문 응답 필드 검증 통과:", sorted(body.keys())[:6])
          PY

          echo "3) 주문 조회"
          detail_json=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" \
            "$base/v2/checkout/orders/$order_id")
          printf '%s' "$detail_json" | python3 - <<'PY'
          import json, sys
          body = json.load(sys.stdin)
          if body.get("id") is None or body.get("status") is None:
              raise SystemExit("::error::주문 조회 응답에 id/status가 없습니다.")
          units = body.get("purchase_units") or []
          if not units:
              raise SystemExit("::error::주문 조회 응답에 purchase_units가 없습니다.")
          amount = units[0].get("amount", {})
          if not amount.get("currency_code") or not amount.get("value"):
              raise SystemExit("::error::purchase_units.amount에 currency_code/value가 없습니다.")
          print(f"   조회 성공: status={body['status']} amount={amount['value']} {amount['currency_code']}")
          PY

          echo "4) 주문 생성 멱등성(PayPal-Request-Id 재사용)"
          replay_json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -H "PayPal-Request-Id: $request_id" \
            -d "{\"intent\":\"AUTHORIZE\",\"purchase_units\":[{\"reference_id\":\"atlas-contract\",\"amount\":{\"currency_code\":\"USD\",\"value\":\"$AMOUNT\"}}]}" \
            "$base/v2/checkout/orders")
          replay_id=$(printf '%s' "$replay_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          if [ "$replay_id" != "$order_id" ]; then
            echo "::error::같은 PayPal-Request-Id로 다른 주문이 생성되었습니다(멱등성 위반)."
            exit 1
          fi
          echo "   멱등 재요청이 같은 order_id를 반환했습니다."

          {
            echo "### PayPal Sandbox 계약 검증 결과"
            echo
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| OAuth 토큰 | 성공 |"
            echo "| 주문 생성 | 성공 (\`$order_status\`) |"
            echo "| 주문 조회 | 성공 |"
            echo "| Request-Id 멱등성 | 성공(동일 order_id) |"
            echo
            echo "승인·캡처·환불은 구매자 승인이 필요해 이 워크플로 범위에서 제외했습니다."
          } >> "$GITHUB_STEP_SUMMARY"
