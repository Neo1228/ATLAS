name: Documentation lint

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "*.md"

  pr-checklist:
    name: PR checklist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: 커밋 제목 형식 확인
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { BASE_SHA, HEAD_SHA, PR_TITLE } = process.env;
          const commitSubjects = execFileSync(
            "git",
            ["log", "--no-merges", "--format=%s", `${BASE_SHA}..${HEAD_SHA}`],
            { encoding: "utf8" },
          )
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          if (commitSubjects.length === 0) {
            console.error("검사할 커밋이 없습니다.");
            process.exit(1);
          }

          const subjects = [PR_TITLE, ...commitSubjects];

          const pattern = /^[a-z]+\([a-z0-9-]+\): .*\p{Script=Hangul}/u;
          const invalidSubjects = subjects.filter((subject) => !pattern.test(subject));
          for (const subject of invalidSubjects) {
            console.error(`::error title=잘못된 PR/커밋 제목::${subject}`);
          }
          if (invalidSubjects.length > 0) {
            console.error("형식: <type>(<scope>): <한국어 요약>");
            process.exit(1);
          }
          NODE
      - name: 체크리스트와 Issue 추적 형식 확인
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const body = (process.env.PR_BODY ?? "").replace(/```[\s\S]*?```/g, "");
          const heading = /^## 검토 체크리스트\s*$/m;
          const template = fs.readFileSync(".github/PULL_REQUEST_TEMPLATE.md", "utf8");
          const checklist = (text) => {
            const section = text.split(heading)[1]?.split(/^## /m)[0] ?? "";
            return [...section.matchAll(/^[ \t]*[-*]\s+\[([ xX])\]\s+.+$/gm)];
          };
          const expected = checklist(template);
          const provided = checklist(body);
          if (expected.length === 0 || provided.length !== expected.length) {
            console.error(`PR 본문에 template 기준 ${expected.length}개 검토 항목을 포함해야 합니다.`);
            process.exit(1);
          }
          const incomplete = [...body.matchAll(/^[ \t]*[-*]\s+\[([ xX])\]\s+.+$/gm)]
            .filter(([, state]) => state.toLowerCase() !== "x");
          if (incomplete.length > 0) {
            console.error(`체크하지 않은 항목 ${incomplete.length}개를 완료해야 병합할 수 있습니다.`);
            process.exit(1);
          }
          const issueLine = body.split(/\r?\n/).find((line) => /^[ \t]*[-*]\s+Issues:\s*/.test(line));
          const entries = issueLine
            ?.replace(/^[ \t]*[-*]\s+Issues:\s*/, "")
            .split(/;\s*/)
            .filter(Boolean) ?? [];
          const invalidTrace = entries.some((entry) => {
            const match = entry.match(/^(Closes|Refs) #(\d+) — \[Issue #(\d+)\]\((https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/\d+)\)$/);
            return !match
              || match[2] !== match[3]
              || match[4] !== `https://github.com/${process.env.REPOSITORY}/issues/${match[2]}`;
          });
          if (entries.length === 0 || invalidTrace) {
            console.error("Issues 항목에 plain-text Closes #N — [Issue #N](URL) 또는 Refs #N — [Issue #N](URL)을 작성하세요. Closes/Refs와 #N을 Markdown link로 감싸지 마세요.");
            process.exit(1);
          }
          const traceLine = body.split(/\r?\n/).find((line) =>
            /^[ \t]*[-*]\s+요구사항·결정·규칙 ID:\s*/.test(line)
          );
          const traceValue = traceLine
            ?.replace(/^[ \t]*[-*]\s+요구사항·결정·규칙 ID:\s*/, "")
            .replace(/<!--[\s\S]*?-->/g, "")
            .trim() ?? "";
          const hasDirectTraceLink = /\[[^\]]+\]\([^)]+\)/.test(traceValue);
          const explicitNoTrace = /^(N\/A|해당 없음)\s*[:：]\s*\S/i.test(traceValue);
          if (!hasDirectTraceLink && !explicitNoTrace) {
            console.error("요구사항·결정·규칙 ID에 직접 링크를 넣거나, 해당 없음과 구체적 사유를 작성하세요.");
            process.exit(1);
          }

          console.log(`${provided.length}개 검토 항목, 전체 checkbox, ${entries.length}개 Issue link, 직접 연결된 추적 기준 확인 완료.`);
          NODE
