services:
  postgres:
    image: postgres:18.6
    volumes:
      # Named volume so the seeded multi-million row dataset survives switching
      # profile overlays (capacity-tiny / capacity-node / capacity-distributed),
      # which otherwise create a fresh anonymous volume and an empty database.
      - atlas-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:-atlas-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: ["observability", "loadtest", "edge-cache"]
    expose:
      - "1025"
      - "8025"
  application:
    image: atlas-application:local
    build:
      context: ./atlas-application
      dockerfile: Dockerfile
    profiles: ["observability", "loadtest", "edge-cache"]
    environment:
      SPRING_PROFILES_ACTIVE: observability
      ATLAS_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas?options=-c%20statement_timeout%3D30000%20-c%20idle_in_transaction_session_timeout%3D60000
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:-atlas-local-only}
      ATLAS_JWT_SIGNING_SECRET: ${ATLAS_JWT_SIGNING_SECRET:-}
      # 단일 replica 로컬 스택 전용 기본값. replica를 늘리거나 재시작 후에도 토큰을 유지하려면 ATLAS_JWT_SIGNING_SECRET을 지정하고 false로 설정.
      ATLAS_JWT_ALLOW_EPHEMERAL_KEY: ${ATLAS_JWT_ALLOW_EPHEMERAL_KEY:-true}
      SPRING_MAIL_HOST: ${ATLAS_SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${ATLAS_SMTP_PORT:-1025}
      ATLAS_PAYMENT_PROVIDER: ${ATLAS_PAYMENT_PROVIDER:-disabled}
      ATLAS_PUBLIC_BASE_URL: ${ATLAS_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-disabled}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-disabled}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      BOK_ECOS_API_KEY: ${BOK_ECOS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${ATLAS_PAYMENT_RETURN_PORT:-18080}:8080"
    expose:
      - "8080"
      - "8081"
    restart: unless-stopped

  # Optional shared cache for public catalog GETs. It is opt-in so local behavior
  # remains unchanged unless --profile edge-cache is selected. The cache is bounded
  # on disk, bypasses Authorization requests, and coalesces concurrent misses.
  catalog-edge-cache:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    profiles: ["edge-cache"]
    environment:
      ATLAS_CACHE_UPSTREAM: ${ATLAS_CACHE_UPSTREAM:-application:8080}
    volumes:
      - ./config/nginx/catalog-cache.conf.template:/etc/nginx/templates/default.conf.template:ro
      - atlas-nginx-cache:/var/cache/nginx/catalog
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      application:
        condition: service_started
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["observability"]
    environment:
      DATA_SOURCE_URI: postgres:5432/atlas?sslmode=disable
      DATA_SOURCE_USER: atlas
      DATA_SOURCE_PASS: ${ATLAS_DB_PASSWORD:-atlas-local-only}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 부하 실험 사이 비교가 가능하도록 시계열을 보관한다. 볼륨이 없으면 컨테이너
      # 재시작마다 모든 지표가 사라져 "이 측정이 유효했는가"를 사후에 판정할 수 없다.
      - --storage.tsdb.retention.time=${ATLAS_PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - atlas-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - application
      - postgres-exporter
    restart: unless-stopped

  # 호스트 부하를 시계열로 남긴다. 이 저장소의 측정 규칙은 "측정 없이 성능을
  # 주장하지 않는다" 이지만, 정작 측정 환경의 상태(load average, 메모리 압박)를
  # 기록하지 않아 호스트 과부하 상태의 값을 정상 값과 구분하지 못했다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://grafana-image-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:-local-render-token}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/atlas-capacity.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - grafana-image-renderer
    restart: unless-stopped

  grafana-image-renderer:
    # Pinned for reproducible panel captures; see docs/03-experiments/EXP-035.
    image: grafana/grafana-image-renderer@sha256:cfa6c8f63e6d626f90208f2880f15bd5facc279daec1b9bb642af07aa850d95e
    profiles: ["observability"]
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:-local-render-token}
    expose:
      - "8081"
    restart: unless-stopped
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://application:8080}
      ATLAS_BASE_URL: ${K6_BASE_URL:-http://application:8080}
      K6_TEST_ACCOUNT_PASSWORD: ${K6_TEST_ACCOUNT_PASSWORD:-}
      K6_MAIL_API_URL: ${K6_MAIL_API_URL:-http://mailpit:8025}
    volumes:
      - ./load-tests:/scripts:ro
      - ./atlas-application/build/k6-results:/results
    depends_on:
      - application
      - mailpit

volumes:
  atlas-postgres-data:
  atlas-prometheus-data:
  atlas-nginx-cache:
