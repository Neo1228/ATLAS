plugins {
    id 'org.springframework.boot' version '4.1.2'
}

dependencies {
    implementation project(':campaign-module')
    implementation project(':admission-module')
    implementation project(':inventory-module')
    implementation project(':order-module')
    implementation project(':payment-module')
    implementation project(':settlement-module')
    implementation project(':catalog-module')
    implementation project(':cart-module')

    implementation project(':account-module')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'net.ttddyy:datasource-proxy:1.10.1'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    // Redis 자동구성(health indicator 등)을 끌어오지 않고 admission gate만 쓰려고 client 라이브러리만 추가한다. 버전은 Boot BOM이 관리한다.
    implementation 'io.lettuce:lettuce-core'
    // 예약 이벤트 relay의 Kafka producer. 자동구성(starter)은 쓰지 않고 relay를 켠 경우에만 직접 구성한다. 버전은 Boot BOM이 관리한다.
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"

    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'com.github.bastiaanjansen:otp-java:2.1.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    // CI가 테스트 클래스를 여러 runner에 나누어 실행할 때만 지정한다(예: 1/4). 비어 있으면 전부 실행한다.
    systemProperty 'atlas.test.shard', System.getenv('ATLAS_TEST_SHARD') ?: ''
    // 로컬 coordinator 시나리오만 이 flag를 export한다. 일반 test suite는 실제 HTTP 연결 설정을 상속하지 않는다.
    systemProperty 'atlas.order-inventory-reservation.enabled', 'false'
}

// 모든 모듈이 공유하는 패키지 구조 규칙(config/archunit)을 이 모듈의 테스트로도 실행한다.
sourceSets.test.java.srcDir rootProject.file('config/archunit')
