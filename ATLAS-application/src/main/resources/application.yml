server:
  address: ${ATLAS_SERVER_ADDRESS:127.0.0.1}
  port: ${ATLAS_SERVER_PORT:8080}

spring:
  application:
    name: atlas
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas-local-only}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          paypal:
            client-id: ${PAYPAL_CLIENT_ID:disabled}
            client-secret: ${PAYPAL_CLIENT_SECRET:disabled}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          paypal:
            token-uri: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}/v1/oauth2/token


atlas:
  security:
    jwt:
      signing-secret: ${ATLAS_JWT_SIGNING_SECRET:}
      issuer: ${ATLAS_JWT_ISSUER:http://127.0.0.1:8080}
      audience: ${ATLAS_JWT_AUDIENCE:atlas-api}
  checkout-window: PT10M
  admission:
    expiry-poll-interval: PT1S
  orders:
    expiry-poll-interval: PT1S
  payment:
    provider: ${ATLAS_PAYMENT_PROVIDER:disabled}
    paypal:
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      return-url: ${ATLAS_PUBLIC_BASE_URL:http://127.0.0.1:8080}/api/checkouts/{checkoutId}/payment/return
      cancel-url: ${ATLAS_PUBLIC_BASE_URL:http://127.0.0.1:8080}/api/checkouts/{checkoutId}/payment/cancel
