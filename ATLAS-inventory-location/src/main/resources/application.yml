server:
  port: ${INVENTORY_LOCATION_PORT:8090}

spring:
  application:
    name: atlas-inventory-location
  datasource:
    url: ${INVENTORY_LOCATION_DB_URL:jdbc:postgresql://127.0.0.1:5433/atlas_inventory}
    username: ${INVENTORY_LOCATION_DB_USER:atlas_inventory}
    password: ${INVENTORY_LOCATION_DB_PASSWORD:atlas-inventory-local-only}
    hikari:
      maximum-pool-size: ${INVENTORY_LOCATION_DB_POOL_SIZE:20}
      connection-timeout: 2000
  flyway:
    enabled: true

inventory:
  service-token: ${INVENTORY_LOCATION_SERVICE_TOKEN:}
  fulfillment-location-id: ${FULFILLMENT_LOCATION_ID:00000000-0000-0000-0000-000000000001}
  reservation-ttl: ${INVENTORY_LOCATION_RESERVATION_TTL:PT2M}
  expiry:
    batch-size: ${INVENTORY_LOCATION_EXPIRY_BATCH_SIZE:100}
    poll-interval: ${INVENTORY_LOCATION_EXPIRY_POLL_INTERVAL:PT1S}
    worker-enabled: ${INVENTORY_LOCATION_EXPIRY_WORKER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
