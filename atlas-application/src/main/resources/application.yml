server:
  address: ${ATLAS_SERVER_ADDRESS:127.0.0.1}
  port: ${ATLAS_SERVER_PORT:8080}
  tomcat:
    # 기본 200 스레드는 Hikari 10 커넥션에 20:1 로 몰려, 대부분의 스레드가 커넥션을
    # 기다리며 메모리와 문맥 전환만 소모한다. 처리량은 풀이 결정하므로 스레드는
    # 풀의 몇 배면 충분하다(출처: HikariCP pool sizing, PostgreSQL wiki).
    # 10 커넥션 × 4 = 40. 정상 DB 작업이 수 ms 이므로 이 정도로 풀을 포화시킬 수 있다.
    threads:
      max: ${ATLAS_TOMCAT_MAX_THREADS:40}
      min-spare: ${ATLAS_TOMCAT_MIN_SPARE_THREADS:10}
    # 대기 연결 큐. 넘치면 503 대신 reset 이 나가므로 여유를 두되 무한정 두지 않는다.
    accept-count: ${ATLAS_TOMCAT_ACCEPT_COUNT:100}
  # 목록 응답이 91 KiB 인데 압축이 없어 원본 그대로 전송됐다.
  # gzip-6 기준 7%까지 줄고, 앱이 소켓에 쓰는 바이트도 함께 줄어든다.
  # 작은 응답은 압축 이득이 없으므로 2 KiB 미만은 건너뛴다.
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/javascript
      - application/xml
      - text/css
      - text/javascript
      - text/plain
      - text/xml

spring:
  application:
    name: atlas
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    # 서버 측 상한을 연결에 건다. spring.jdbc.template.query-timeout 은 JdbcTemplate 만
    # 덮고 JPA/Hibernate 쿼리(@Query, 파생 쿼리, findWithLock 등)는 덮지 못한다.
    # statement_timeout 은 서버가 직접 끊으므로 두 경로 모두에 적용된다.
    # idle-in-transaction 상한은 커넥션을 쥔 채 멈춘 요청을 자동으로 회수한다.
    # lock_timeout 5초는 행 잠금(Seller-SKU admission counter, 재고 행 등) 대기를 statement_timeout 30초
    # 전에 끊어, 잠금을 쥔 쪽이 멈췄을 때 커넥션 풀(10개)이 30초 동안 대기자로 차는 것을 막는다.
    # 값 근거: 한 Seller-SKU에 join 30 스레드를 몰았을 때 지연 최대 1.9초(EXP-090, 공유 호스트)의 약 2.6배.
    # 끊기면 트랜잭션이 롤백되고 503 + Retry-After로 알리며, 클라이언트가 같은 Idempotency-Key로 재시도한다(ADR-0083).
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas?options=-c%20statement_timeout%3D30000%20-c%20idle_in_transaction_session_timeout%3D60000%20-c%20lock_timeout%3D5000}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas-local-only}
    hikari:
      # 커넥션 대기 상한.
      #
      # 왜 500ms 인가: 이 값이 곧 "실패를 배출하는 속도"다. Tomcat 스레드가 N개이고
      # 대기 상한이 T초이면, 굶는 요청을 배출하는 최대 속도는 N/T 다. 200 스레드 × 5초면
      # 40 rps 로, 그 이상 유입되면 Tomcat accept queue(기본 100)가 차서 503 대신
      # TCP reset 이 나간다. 500ms 면 같은 200 스레드로 400 rps 까지 정상적으로
      # 503 을 돌려줄 수 있다(Meituan·Hikari·AWS 가이드의 "짧게 끊고 빨리 실패" 원칙).
      #
      # 정상 경로에는 영향이 없다: DB 작업은 수 ms 이고 풀은 10개다. 500ms 를 기다릴
      # 정도로 풀이 비었다는 것은 이미 과부하라는 뜻이다.
      connection-timeout: ${ATLAS_DB_CONNECTION_TIMEOUT_MS:500}
      # 커넥션이 살아있는지 확인하는 주기. 장애 후 죽은 커넥션을 빨리 교체한다.
      validation-timeout: ${ATLAS_DB_VALIDATION_TIMEOUT_MS:3000}
  jdbc:
    template:
      # 단일 SQL 상한. 이 값이 없으면 느린 쿼리 하나가 커넥션을 영구 점유한다.
      # 정산·주문 조회는 수십 ms 이므로 30s 는 정상 경로에 영향이 없다.
      query-timeout: ${ATLAS_DB_QUERY_TIMEOUT_SECONDS:30}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Spring Boot 의 모든 자동 구성 HTTP 클라이언트(특히 OAuth2 토큰 요청)에 적용되는 상한.
  # 토큰 요청에 타임아웃이 없으면 PayPal OAuth 가 멈출 때 결제 스레드가 무한 대기한다.
  # PayPalRestClient 는 자체 요청 팩토리로 API 호출 상한을 별도로 둔다.
  http:
    client:
      connect-timeout: ${ATLAS_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${ATLAS_HTTP_READ_TIMEOUT:10s}
  # JavaMail은 이 값이 없으면 SMTP 연결·읽기·쓰기를 무기한 기다린다. 인증 메일은 요청 스레드에서 보내므로 SMTP가
  # 멈추면 요청이 끝나지 않는다(EXP-113 C2). 0은 무한이다.
  mail:
    properties:
      mail.smtp.connectiontimeout: ${ATLAS_SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${ATLAS_SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${ATLAS_SMTP_WRITE_TIMEOUT_MS:5000}
  security:
    oauth2:
      client:
        registration:
          paypal:
            client-id: ${PAYPAL_CLIENT_ID:disabled}
            client-secret: ${PAYPAL_CLIENT_SECRET:disabled}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          paypal:
            token-uri: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}/v1/oauth2/token


atlas:
  datasource:
    # replica 하나에 허용되는 커넥션 수. 0 이면 검사하지 않는다.
    # 실제 상한은 풀러의 서버 연결 상한(예: PgBouncer max_db_connections)을
    # replica 수로 나눈 값이다. 이 값을 넘기면 애플리케이션은 기동은 되지만
    # 요청이 풀러에서 대기하며 모든 API 가 균일하게 느려진다.
    # /actuator/health 에서 OUT_OF_SERVICE 로 노출된다.
    pool-budget-per-replica: ${ATLAS_POOL_BUDGET_PER_REPLICA:0}
  security:
    jwt:
      signing-secret: ${ATLAS_JWT_SIGNING_SECRET:}
      # 서명 키가 없을 때 프로세스 임시 키를 허용할지 여부. 재시작/replica 간 토큰이 호환되지 않으므로 로컬 단일 인스턴스 전용.
      allow-ephemeral-key: ${ATLAS_JWT_ALLOW_EPHEMERAL_KEY:false}
      issuer: ${ATLAS_JWT_ISSUER:http://127.0.0.1:8080}
      audience: ${ATLAS_JWT_AUDIENCE:atlas-api}
  checkout-window: PT10M
  # 인증 시도 제한. 실패가 한도를 넘으면 비밀번호 검증(PBKDF2, 수십 ms CPU) 전에 거절한다.
  auth:
    throttle:
      window: ${ATLAS_AUTH_THROTTLE_WINDOW:PT15M}
      subject-limit: ${ATLAS_AUTH_THROTTLE_SUBJECT_LIMIT:10}
      origin-limit: ${ATLAS_AUTH_THROTTLE_ORIGIN_LIMIT:60}
      retention: ${ATLAS_AUTH_THROTTLE_RETENTION:PT24H}
      purge-batch-size: ${ATLAS_AUTH_THROTTLE_PURGE_BATCH_SIZE:500}
      purge-initial-delay: ${ATLAS_AUTH_THROTTLE_PURGE_INITIAL_DELAY:PT5M}
      purge-interval: ${ATLAS_AUTH_THROTTLE_PURGE_INTERVAL:PT10M}
  # 인증 메일 outbox(ADR-0102, EXP-113). 기본으로 켜져 요청 transaction에 전달 의도만 기록하고 전용 worker가 보낸다.
  # false는 되돌림 스위치다: 커밋 뒤 요청 스레드에서 (연결 반환 뒤) 보내고 실패는 로그만 남아 종료·SMTP 오류 때 메일을 잃는다.
  account:
    notification:
      outbox:
        enabled: ${ATLAS_ACCOUNT_NOTIFICATION_OUTBOX_ENABLED:true}
      # 메일 한 통의 최대 전송 시간(위 SMTP timeout 합)보다 길어야 한다. 짧으면 전송 중인 행을 다른 worker가 다시 잡는다.
      lease-duration: ${ATLAS_ACCOUNT_NOTIFICATION_LEASE_DURATION:PT2M}
      retry:
        initial-backoff: ${ATLAS_ACCOUNT_NOTIFICATION_INITIAL_BACKOFF:PT5S}
        max-backoff: ${ATLAS_ACCOUNT_NOTIFICATION_MAX_BACKOFF:PT5M}
        max-attempts: ${ATLAS_ACCOUNT_NOTIFICATION_MAX_ATTEMPTS:10}
      worker:
        initial-delay: ${ATLAS_ACCOUNT_NOTIFICATION_INITIAL_DELAY:PT1S}
        poll-interval: ${ATLAS_ACCOUNT_NOTIFICATION_POLL_INTERVAL:PT1S}
        batch-size: ${ATLAS_ACCOUNT_NOTIFICATION_BATCH_SIZE:20}
  admission:
    expiry-poll-interval: PT1S
    expiry-sweep-batch-size: ${ATLAS_ADMISSION_EXPIRY_SWEEP_BATCH_SIZE:100}
    expiry-sweep-time-budget: ${ATLAS_ADMISSION_EXPIRY_SWEEP_TIME_BUDGET:PT2S}
    # Seller가 K(Seller-SKU별 동시 checkout slot 수)와 ticket TTL을 주지 않을 때의 기본값과 요청 값의 상한.
    # 기본값은 구매자 행동을 가정한 합성 모형(EXP-086: 구매자 300명, 재고 60)에서 대기 p95 60초 이하,
    # 대기 만료 손실 10% 이하, 시작 전 포기 slot 시간 25% 이하를 지키는 칸 중 접수가 같은 가장 작은 K와
    # 그 K에서 가장 짧은 TTL인 K 50 x TTL 120초다(ADR-0083). 실제 구매자 분포가 아니므로 가정이며,
    # 바꾸는 조건과 되돌리는 방법은 ADR-0083에 있다. 상한은 튜닝 값이 아니라 오입력과 남용으로 slot이 무제한이 되는 것을
    # 막는 값이다(부하 스크립트 gate4.js의 K 1667, TTL 7200초를 허용하는 크기).
    default-max-active-checkouts: ${ATLAS_ADMISSION_DEFAULT_MAX_ACTIVE_CHECKOUTS:50}
    max-active-checkouts-limit: ${ATLAS_ADMISSION_MAX_ACTIVE_CHECKOUTS_LIMIT:10000}
    default-ticket-ttl: ${ATLAS_ADMISSION_DEFAULT_TICKET_TTL:PT2M}
    ticket-ttl-limit: ${ATLAS_ADMISSION_TICKET_TTL_LIMIT:PT2H}
    # 같은 Seller-SKU에서 한 구매자가 동시에 가질 수 있는 live ticket(WAITING·CHECKOUT_ACTIVE·CHECKOUT_STARTED) 수.
    # 0이면 검사하지 않는다(규칙 끄기). 검사는 counter 잠금 안에서 하고 부분 인덱스를 쓴다(ADR-0088, EXP-092).
    max-live-tickets-per-buyer: ${ATLAS_ADMISSION_MAX_LIVE_TICKETS_PER_BUYER:1}
    # 종료된 ticket(EXPIRED·CHECKOUT_FAILED) 정리. 주문이 가리키는 ticket은 지우지 않는다. 지운 뒤에는 되살릴 수 없으므로
    # purge-enabled=false로 끌 수 있다. 값은 구매자 행동·운영 규모를 모르는 상태의 가정이다(ADR-0088 "바꿀 조건").
    # retention은 ticket 생성 시각 기준이고 같은 Idempotency-Key 재요청이 기존 ticket을 돌려받는 기간이기도 하다(하한 1일).
    tombstone:
      purge-enabled: ${ATLAS_ADMISSION_TOMBSTONE_PURGE_ENABLED:true}
      retention: ${ATLAS_ADMISSION_TOMBSTONE_RETENTION:P30D}
      purge-batch-size: ${ATLAS_ADMISSION_TOMBSTONE_PURGE_BATCH_SIZE:500}
      purge-initial-delay: ${ATLAS_ADMISSION_TOMBSTONE_PURGE_INITIAL_DELAY:PT5M}
      purge-interval: ${ATLAS_ADMISSION_TOMBSTONE_PURGE_INTERVAL:PT10M}
  orders:
    expiry-poll-interval: PT1S
    expiry-sweep-batch-size: ${ATLAS_ORDERS_EXPIRY_SWEEP_BATCH_SIZE:100}
    expiry-sweep-time-budget: ${ATLAS_ORDERS_EXPIRY_SWEEP_TIME_BUDGET:PT2S}
  order:
    return:
      # 반품 요청 기간과 검수 마감(ADR-0085, ADR-0089). 7일·5영업일은 근거 있는 정책이 아니라 가정이며,
      # 코드를 바꾸지 않고 이 값으로 조정한다. 기간은 반품 줄이 속한 출고의 delivered_at부터 센다(경계 포함).
      # window-enforced=false는 롤백 스위치: 기간 검사를 끈다(이전 동작). 영업일은 월~금이고 공휴일은 지원하지 않는다.
      window: ${ATLAS_ORDER_RETURN_WINDOW:P7D}
      window-enforced: ${ATLAS_ORDER_RETURN_WINDOW_ENFORCED:true}
      inspection-business-days: ${ATLAS_ORDER_RETURN_INSPECTION_BUSINESS_DAYS:5}
      business-zone: ${ATLAS_ORDER_RETURN_BUSINESS_ZONE:Asia/Seoul}
  payment:
    provider: ${ATLAS_PAYMENT_PROVIDER:disabled}
    # 원화→USD 환율 공급자. bok-ecos(기본, BOK_ECOS_API_KEY 필요) 또는 frankfurter(가입·key 없는 ECB 기준환율).
    exchange-rate:
      provider: ${ATLAS_EXCHANGE_RATE_PROVIDER:bok-ecos}
    # 승인 화면 이탈에도 결제 대기가 무기한 남지 않도록 하는 deadline. PayPal approval 유효기간보다 짧게 둔다.
    approval-ttl: ${ATLAS_PAYMENT_APPROVAL_TTL:PT30M}
    # 외부 환율 API(BOK ECOS)는 일 단위 고시다. 결제마다 호출하지 않고 짧게 재사용한다.
    # max-stale 은 외부 장애 시 마지막 정상값을 허용하는 시간이다. 넘으면 결제를 막는다.
    fx:
      cache-ttl: ${ATLAS_PAYMENT_FX_CACHE_TTL:PT60S}
      max-stale: ${ATLAS_PAYMENT_FX_MAX_STALE:PT10M}
      # 조회가 실패한 뒤 이 시간 동안은 외부를 다시 부르지 않는다(±20% 무작위). 장애 중 호출이 요청률이 아니라
      # 이 간격에 묶이게 해 replica 수가 늘어도 외부 호출이 폭주하지 않는다.
      failure-backoff: ${ATLAS_PAYMENT_FX_FAILURE_BACKOFF:PT15S}
    recovery:
      initial-delay: ${ATLAS_PAYMENT_RECOVERY_INITIAL_DELAY:PT30S}
      initial-poll-delay: ${ATLAS_PAYMENT_RECOVERY_INITIAL_POLL_DELAY:PT2S}
      poll-interval: ${ATLAS_PAYMENT_RECOVERY_POLL_INTERVAL:PT1S}
      batch-size: ${ATLAS_PAYMENT_RECOVERY_BATCH_SIZE:10}
      lease-duration: ${ATLAS_PAYMENT_RECOVERY_LEASE_DURATION:PT60S}
      max-attempts: ${ATLAS_PAYMENT_RECOVERY_MAX_ATTEMPTS:8}
      max-age: ${ATLAS_PAYMENT_RECOVERY_MAX_AGE:PT24H}
      base-backoff: ${ATLAS_PAYMENT_RECOVERY_BASE_BACKOFF:PT1S}
      max-backoff: ${ATLAS_PAYMENT_RECOVERY_MAX_BACKOFF:PT15M}
      worker:
        enabled: ${ATLAS_PAYMENT_RECOVERY_WORKER_ENABLED:true}
      operator:
        enabled: ${ATLAS_PAYMENT_RECOVERY_OPERATOR_ENABLED:false}
        username: ${ATLAS_PAYMENT_RECOVERY_OPERATOR_USERNAME:}
        password: ${ATLAS_PAYMENT_RECOVERY_OPERATOR_PASSWORD:}
    paypal:
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      capture-base-url: ${ATLAS_PAYPAL_CAPTURE_BASE_URL:}
      # 비표준 PayPal port는 JVM에서 loopback으로 확인된 로컬 proxy에만 허용한다.
      local-proxy-enabled: ${ATLAS_PAYPAL_LOCAL_PROXY_ENABLED:false}
      # 서블릿 요청 스레드가 PayPal 응답을 기다리며 동시에 묶일 수 있는 호출 수의 상한(ADR-0098, EXP-108).
      # 0 이하면 상한이 없다(기본, 이전 동작). 상한을 넘는 요청 스레드의 호출은 아무것도 보내기 전에 기다리지 않고
      # 거절해 UNKNOWN(복구 대상)으로 남는다. 복구 worker의 호출은 세지도 거절하지도 않는다.
      # 측정(EXP-108): 지연 10초에서 Tomcat 스레드 40개는 도착률 4/s(40개 점유)에서 차고, 8/s에서는 PayPal을 쓰지
      # 않는 요청까지 밀린다. 켜려면 Tomcat 최대 스레드(40)보다 작은 값(예: 20~30)을 둔다.
      bulkhead:
        max-concurrent-calls: ${ATLAS_PAYPAL_BULKHEAD_MAX_CONCURRENT_CALLS:0}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      webhook-retry:
        worker:
          # Canonical location: the worker used to read atlas.paypal.*, which nothing
          # declared, so these values could not be overridden in a deployment.
          enabled: ${ATLAS_PAYPAL_WEBHOOK_RETRY_ENABLED:true}
          poll-interval: ${ATLAS_PAYPAL_WEBHOOK_RETRY_POLL_INTERVAL:PT1S}
          initial-delay: ${ATLAS_PAYPAL_WEBHOOK_RETRY_INITIAL_DELAY:PT1S}
      payouts:
        enabled: ${ATLAS_PAYPAL_PAYOUTS_ENABLED:false}
        supported-countries: ${ATLAS_PAYPAL_PAYOUT_SUPPORTED_COUNTRIES:US}
        recipient-encryption-key: ${ATLAS_PAYPAL_PAYOUT_RECIPIENT_ENCRYPTION_KEY:}
        recipient-encryption-key-id: ${ATLAS_PAYPAL_PAYOUT_RECIPIENT_KEY_ID:active}
        recipient-decryption-keys: ${ATLAS_PAYPAL_PAYOUT_RECIPIENT_DECRYPTION_KEYS:}
        worker:
          enabled: ${ATLAS_PAYPAL_PAYOUT_WORKER_ENABLED:false}
          initial-delay: ${ATLAS_PAYPAL_PAYOUT_WORKER_INITIAL_DELAY:PT5S}
          poll-interval: ${ATLAS_PAYPAL_PAYOUT_WORKER_POLL_INTERVAL:PT5S}
          batch-size: ${ATLAS_PAYPAL_PAYOUT_WORKER_BATCH_SIZE:1}
          lease-duration: ${ATLAS_PAYPAL_PAYOUT_WORKER_LEASE_DURATION:PT60S}
          max-attempts: ${ATLAS_PAYPAL_PAYOUT_WORKER_MAX_ATTEMPTS:8}
          max-unknown-age: ${ATLAS_PAYPAL_PAYOUT_WORKER_MAX_UNKNOWN_AGE:P29D}
          max-waiting-age: ${ATLAS_PAYPAL_PAYOUT_WORKER_MAX_WAITING_AGE:P60D}
  settlement:
    payout:
      operator:
        enabled: ${ATLAS_SETTLEMENT_PAYOUT_OPERATOR_ENABLED:false}
        # account: 사람별 operator account(JWT, 승인자 ≠ 검증자 규칙 적용). shared-credential: 단일 Basic 자격 증명(rollback용, 규칙 미적용). ADR-0092.
        identity: ${ATLAS_SETTLEMENT_PAYOUT_OPERATOR_IDENTITY:account}
        # username, password는 identity=shared-credential 일 때만 읽는다.
        username: ${ATLAS_SETTLEMENT_PAYOUT_OPERATOR_USERNAME:}
        password: ${ATLAS_SETTLEMENT_PAYOUT_OPERATOR_PASSWORD:}
    # capture 금액을 수수료·보류·판매자 몫으로 분해한다. 10,000 bps = 100%.
    # 적용 시점 요율은 journal 에 스냅샷되므로, 값을 바꿔도 과거 분개는 재계산되지 않는다.
    fee-rate-bps: ${ATLAS_SETTLEMENT_FEE_RATE_BPS:0}
    reserve-rate-bps: ${ATLAS_SETTLEMENT_RESERVE_RATE_BPS:0}
    ledger-audit:
      # 원장 불변식 점검(탐지 전용, 기본 꺼짐). 켜면 주기적으로 원장 전체를 읽어 점검별 위반 건수를
      # 게이지 settlement.ledger.audit.violations{check}로 노출한다. 원장 크기에 비례하는 읽기이므로 켜기 전에
      # 운영 크기에서 질의 시간을 재고 poll-interval 을 정한다(EXP-111, 운영 가이드의 원장 무결성 절).
      enabled: ${ATLAS_SETTLEMENT_LEDGER_AUDIT_ENABLED:false}
      initial-delay: ${ATLAS_SETTLEMENT_LEDGER_AUDIT_INITIAL_DELAY:PT1M}
      poll-interval: ${ATLAS_SETTLEMENT_LEDGER_AUDIT_POLL_INTERVAL:PT1H}
    report:
      operator:
        enabled: ${ATLAS_SETTLEMENT_REPORT_OPERATOR_ENABLED:false}
        username: ${ATLAS_SETTLEMENT_REPORT_OPERATOR_USERNAME:}
        password: ${ATLAS_SETTLEMENT_REPORT_OPERATOR_PASSWORD:}
  order-inventory-reservation:
    enabled: false
    # 단일 location으로 처리할 수 없는 SellerOrder를 여러 location에 나눠 예약한다(분할 출고).
    split-allocation-enabled: false
    api-token: ${ATLAS_ORDER_INVENTORY_RESERVATION_API_TOKEN:}
    service-token: ${INVENTORY_LOCATION_SERVICE_TOKEN:}
    location-endpoints: ${ATLAS_ORDER_INVENTORY_RESERVATION_LOCATION_ENDPOINTS:}
    connect-timeout: 250ms
    read-timeout: PT2S
    recovery:
      poll-interval: PT1S
      worker-enabled: true
      batch-size: 100
      # Lease half-life must exceed connect/read timeouts plus the configured one-second safety margin.
      lease-duration: PT30S
      base-backoff: PT1S
      max-backoff: PT1M
      minimum-reservation-remaining: PT10S
      max-attempts: 8

    # 예약 workflow 상태 변경 이벤트 로그를 Kafka로 내보내는 relay. 기본은 꺼져 있다.
    # 소비자(정산 원장, 가용 재고 projection, 감사)는 각자 cursor로 order DB의 로그를 직접 읽을 수도 있다.
    event-relay:
      enabled: false
      bootstrap-servers: localhost:9092
      topic: atlas.order-inventory.events
      # 한 묶음의 크기. 전송이 실패하면 같은 묶음을 다시 보내므로 이 값이 한 번의 실패가 만드는 중복의 상한이다(ADR-0082).
      batch-size: 100
      poll-interval: PT0.2S
      # 한 묶음 전송의 한도. 넘기면 cursor를 옮기지 않고 같은 묶음을 다시 보낸다.
      send-timeout: PT10S
      # relay replica 하나만 전송하게 하는 cursor lease. send-timeout의 두 배보다 5초 이상 길어야 한다.
      lease-duration: PT30S
