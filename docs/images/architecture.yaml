# Sources (item | claim | file)
#  client->app 직접   | compose가 application을 127.0.0.1:18080으로 공개           | compose.yaml:56-57
#  cache              | nginx 1.29, 프로파일 edge-cache에서만 뜸, 18082 공개, 상류는 application:8080 | compose.yaml:66-75
#  cache 동작         | GET/HEAD 200만 1초 캐시, Authorization/쿠키 요청은 우회       | config/nginx/catalog-cache.conf.template:13-23,53,62
#  app                | Spring Boot 단일 프로세스, 모듈은 settings.gradle의 include   | settings.gradle, atlas-application/build.gradle
#  pg                 | postgres:18.6, 127.0.0.1:5432                                | compose.yaml:3,14
#  loc 켬 조건        | order-inventory-reservation.enabled 기본 false, HttpLocationClient는 true일 때만 빈 | atlas-application/src/main/resources/application.yml:200-201, HttpLocationClient.java:27 ; 기본 compose에는 location 서비스 없음(load-tests/compose-inventory-location.yaml에만 있음)
#  loc                | 독립 Spring Boot runtime, application이 RestClient로 호출    | ADR-0059 (docs/02-decisions/adr/ADR-0059-independent-inventory-location-service.md), HttpLocationClient.java:22-30
#  loc 개수          | instance 하나는 location 하나와 그 DB만 소유, location마다 runtime  | ADR-0059.md:24, atlas-inventory-location/src/main/resources/application.yml:19
#  locpg              | loc가 자기 datasource를 가짐(기본 127.0.0.1:5433)            | atlas-inventory-location/src/main/resources/application.yml:7-8
#  paypal 켬 조건     | ATLAS_PAYMENT_PROVIDER 기본 disabled                          | compose.yaml:44, application.yml:125
#  fx                 | 결제는 환율 스냅샷을 만들고 기본 공급자는 BOK ECOS(대안 frankfurter)  | PaymentServiceImpl.java:433,616, application.yml:126-128
#  paypal             | PayPal Sandbox 호출, 실제 돈 아님                            | ADR-0026, atlas-payment (provider.paypal)
#  smtp               | SPRING_MAIL_HOST 기본 mailpit:1025 (기본 구성에서 켜짐)                           | compose.yaml:42-43
#  redis (선택)       | admission-gate.enabled=true일 때만 빈 생성                   | RedisStockAdmissionControlConfiguration.java:13
#  kafka (선택)       | event-relay.enabled=true일 때만 빈 생성                      | ReservationEventConfiguration.java:23
#  로고 정책          | 벤더 원문에서 로고 사용 조건을 확인한 제품만 로고를 쓴다. 나머지는 이름만 쓴다.
#   kafka  사용        | ASF FAQ: 변경하지 않은 공식 로고면 가능. kafka-logo-no-text.png 512x512 그대로 | https://www.apache.org/foundation/marks/faq/ , https://kafka.apache.org/logos/
#   mailpit 사용       | MIT 저장소의 server/ui/favicon.svg, 커밋 d54514ceb52c377307464850ddbaedbcbe70e1de | https://github.com/axllent/mailpit (LICENSE: MIT, Ralph Slooten)
#   spring 안 씀       | 로고는 Broadcom이 변경 없이 쓰는 데만 허용 | https://spring.io/trademarks
#   postgresql 안 씀   | 수정 금지, 다른 로고와 함께 제시 금지, 귀속 문구 필요 | https://www.postgresql.org/about/policies/trademarks/
#   redis 안 씀        | 정책이 서술적 이름 사용만 명시하고 로고는 불분명 | https://redis.io/legal/trademark-policy/
#   paypal 안 씀       | Newsroom 자산은 "마케팅이나 광고에는 쓸 수 없다"는 문구가 있어 README 사용이 해당하는지 판단 못 함 | PayPal Brand Elements Q4 2020 (filecache.mediaroom.com/mr5mr_paypal/179756/download/PayPal_Brand_Elements_Q42020.pdf)
#   nginx 안 씀        | F5 상표 정책 페이지에서 로고 조항을 확인하지 못함 | https://www.f5.com/company/policies/trademarks
# 다시 만드는 법(excalidraw-architecture 스킬): kafka-official, mailpit-official은 스킬 기본 자산에 없으므로 임시 자산 폴더에 먼저 등록한다.
#   export EXCALIDRAW_ARCH_ASSETS=<스킬 assets를 복사한 폴더>
#   add_logo.py file kafka-official kafka-logo-no-text.png --name "Apache Kafka" --source https://kafka.apache.org/logos/kafka-logo-no-text.png --license "ASF logo, unmodified, permitted per https://www.apache.org/foundation/marks/faq/ ; trademark: Apache Software Foundation"
#   add_logo.py file mailpit-official favicon.svg --name Mailpit --source https://github.com/axllent/mailpit/blob/d54514ceb52c377307464850ddbaedbcbe70e1de/server/ui/favicon.svg --license "MIT (c) 2022-Now Ralph Slooten"
#   build.py architecture.yaml --out <폴더>/architecture.excalidraw --png <폴더>/architecture.png   (.excalidraw 원본은 저장소에 올리지 않는다)
# Composition: application을 가운데(행2 열2)에 두고 호출 방향을 오른쪽과 위아래로 펼친다. 켜야 동작하는 영역은 서로 겹치지 않게 세로로 쌓는다. 호출자는 왼쪽,
#  저장소와 독립 runtime은 오른쪽, 메일은 위, 선택 요소(redis, kafka)는 아래 한 영역에 모아 "기본은 꺼짐"을 공간으로 표현한다.
#  기본으로 켜지지 않는 경로(재고 예약, 결제, Redis, Kafka)는 "켬" 영역으로 묶어 "기본은 꺼짐"을 공간으로 표현한다.
