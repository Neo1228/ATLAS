server:
  port: ${INVENTORY_LOCATION_PORT:8090}

spring:
  application:
    name: atlas-inventory-location
  datasource:
    url: ${INVENTORY_LOCATION_DB_URL:jdbc:postgresql://127.0.0.1:5433/atlas_inventory}
    username: ${INVENTORY_LOCATION_DB_USER:atlas_inventory}
    password: ${INVENTORY_LOCATION_DB_PASSWORD:atlas-inventory-local-only}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 2000
  flyway:
    enabled: true

inventory:
  service-token: ${INVENTORY_LOCATION_SERVICE_TOKEN:}
  fulfillment-location-id: ${FULFILLMENT_LOCATION_ID:00000000-0000-0000-0000-000000000001}
  reservation-ttl: PT2M
  expiry:
    batch-size: 100
    poll-interval: PT1S
    worker-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
