plugins {
    id 'org.springframework.boot' version '4.1.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'com.tngtech.archunit:archunit:1.5.1'

 // order 가 이 서비스의 응답을 해석하는 어휘(예약 상태, 오류 코드)가 이 서비스와 같은지 테스트가 비교한다.
 // 비교하려면 order 의 enum 이 보여야 하지만 두 서비스는 독립 배포되므로 main 의존은 만들지 않는다.
 // 테스트 범위에서만, 그리고 order 가 끌고 오는 런타임 의존(JPA 등)은 이 서비스의 테스트 클래스패스에 넣지 않는다.
 testImplementation(project(':atlas-order')) { transitive = false }

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('bootJar') {
    archiveFileName = 'atlas-inventory-location.jar'
}

// 모든 모듈이 공유하는 패키지 구조 규칙(config/archunit)을 이 모듈의 테스트로도 실행한다.
sourceSets.test.java.srcDir rootProject.file('config/archunit')
