global:
  scrape_interval: 5s
  evaluation_interval: 15s

# EXP-035 distributed phase: one target per application replica so per-instance
# saturation is visible instead of being averaged away.
scrape_configs:
  - job_name: atlas-application
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-a:8081"]
        labels:
          instance_name: app-a
      - targets: ["app-b:8081"]
        labels:
          instance_name: app-b
      - targets: ["app-c:8081"]
        labels:
          instance_name: app-c

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
