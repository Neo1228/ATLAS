global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: atlas-application
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["application:8081"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # PgBouncer 내부 대기 지표. 연결 대기가 병목인지 판정하는 데 쓴다.
  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
