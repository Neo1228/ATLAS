# Deliberately constrained single-node profile for capacity experiments (EXP-035).
#
# Why: measuring on the full laptop (11 CPUs / 18 GiB) produces numbers that say
# more about the developer machine than about the service. This file pins the
# experiment to a small, reproducible envelope so the "single node hits a wall"
# result is a property of the declared spec, not of whatever hardware happened to
# be free. Distributed comparison runs use the same per-container limits.
#
# Usage:
#   docker compose -f compose.yaml -f compose.capacity-node.yaml \
#     --profile observability --profile loadtest up -d application postgres
#
# The limits below are the *node spec* referenced by docs/03-experiments/EXP-035.

services:
  postgres:
    command:
      - postgres
      - -c
      # 100 is the PostgreSQL default; lowered so connection exhaustion is
      # reachable and observable rather than theoretical on a small node.
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
    cpus: 2.0
    mem_limit: 2g

  application:
    cpus: 2.0
    mem_limit: 2g
    environment:
      # Two cores => keep the request pool small enough that context switching,
      # not the workload, does not dominate the result. Defaults for the expiry
      # sweeps are left alone so the background work matches normal operation.
      SERVER_TOMCAT_THREADS_MAX: "64"
      SERVER_TOMCAT_ACCEPT_COUNT: "64"
