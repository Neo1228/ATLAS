# Severely constrained baseline for EXP-037 ("start small, find the wall").
#
# Why this file exists
# --------------------
# EXP-035 used 2 vCPU / 2 GiB for both app and PostgreSQL and still absorbed
# 10 read-iterations/s (60 HTTP RPS). That is not a small starting point — it is
# already a comfortable node. This profile deliberately goes *below* the smallest
# sensible AWS instance so the first wall appears early and is unambiguous.
#
# Reference points (AWS docs, checked 2026-11):
#   - t4g.small : 1 vCPU share, 2 GiB  — baseline 24% (2 CPU credits/h, 576 cap)
#   - t4g.medium: 2 vCPU,      4 GiB  — baseline 24%
#   - db.r7g.large: 2 vCPU,   16 GiB  — smallest memory-optimized RDS
#
# The app container gets 1.0 CPU (a t4g.small baseline share is 0.24 vCPU, so this
# is still generous but small enough to saturate). PostgreSQL gets 1.0 CPU as well,
# because giving the DB more than the app would hide the app-side wall.
#
# Usage:
#   docker compose -f compose.yaml -f compose.capacity-tiny.yaml \
#     --profile observability --profile loadtest up -d application postgres
#
# The measured result and the wall it produced are recorded in EXP-037.

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - random_page_cost=1.1
    cpus: 1.0
    mem_limit: 1g

  application:
    cpus: 1.0
    mem_limit: 1g
    environment:
      # A single core cannot usefully run a large servlet pool; 32 keeps queueing
      # visible in the latency distribution instead of hiding it in thread stacks.
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_ACCEPT_COUNT: "32"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:MaxRAMPercentage=75"
