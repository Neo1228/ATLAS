// 대화형 쇼핑 비서(ADR-0109). catalog 검색, order 장바구니·checkout, llm 클라이언트를 구매자 권한으로 묶는다.
// 이 모듈에 의존하는 도메인 모듈은 없다(application만 HTTP로 노출한다).
dependencies {
    implementation project(':atlas-ai')
    implementation project(':atlas-catalog')
    implementation project(':atlas-order')
    implementation project(':atlas-payment')
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
}
