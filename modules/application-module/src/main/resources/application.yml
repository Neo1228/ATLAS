server:
  address: ${ATLAS_SERVER_ADDRESS:127.0.0.1}
  port: ${ATLAS_SERVER_PORT:8080}

spring:
  application:
    name: atlas
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas-local-only}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

atlas:
  checkout-window: PT10M
  admission:
    expiry-poll-interval: PT1S
  orders:
    expiry-poll-interval: PT1S
